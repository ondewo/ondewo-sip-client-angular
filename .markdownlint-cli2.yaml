# Auto-fix the mechanical rules (blank-line spacing, list indentation, emphasis
# style, ...) the same way ruff-format does for Python.
fix: true
config:
  # MD013 line-length: docs contain long lines / tables.
  MD013: false
  # MD033 no-inline-html: docs embed <p>/<code> HTML tags.
  MD033: false
  # MD053 unused-link-reference-definitions: the release slices README between
  # [comment]: <> (START/END OF GITHUB README) markers, which MD053 would delete.
  MD053: false
  # MD024 duplicate-heading: changelogs repeat "### Improvements" / "### Breaking
  # Changes" under each release section; allow when not direct siblings.
  MD024:
    siblings_only: true
  # MD040 fenced-code-language: README embeds plain directory-tree / output blocks.
  MD040: false
  # MD041 first-line-heading: README opens with the HTML branding/logo header.
  MD041: false
  # MD045 image-alt-text: the branding header uses <img> logos / social icons.
  MD045: false
ignores:
  # LICENSE.md is a verbatim copy of the Apache-2.0 text and must not be reflowed:
  # MD029 renumbers its clause headings "2."-"9." to "1." and MD034 wraps the
  # apache.org URL in angle brackets, both of which alter the licence as published.
  # A pre-commit-level `exclude:` cannot protect it - the `globs: ['*.md']` above is
  # ADDED to the filenames pre-commit passes, so the file is linted either way.
  - 'LICENSE.md'
  - 'node_modules/**'
  - 'api/**'
  - 'fesm2022/**'
  - 'coverage/**'
  - 'dist/**'
  - 'build/**'
  - '.venv/**'
  - 'ondewo-proto-compiler/**'
  - 'src/ondewo-sip-api/**'

# NOTE: no `globs:` here, deliberately. markdownlint-cli2 processes its config globs IN ADDITION to the
# filenames pre-commit passes it. pre-commit splits the markdown files across several concurrent hook
# processes, so a root-level `globs: ['*.md']` made EVERY batch also lint (and, with fix:true, REWRITE) the
# root *.md files - two processes writing RELEASE.md at once, which can corrupt it. Measured on this repo:
# with globs, a 2-file batch reported "Linting: 5 files"; without, "Linting: 2 files", while the total set
# still covers every markdown file exactly once (pre-commit passes them all via types: [markdown]).
